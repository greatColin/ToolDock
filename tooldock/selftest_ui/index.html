<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolDock 模块自测</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/__test/ui/style.css"></head>
<body><header class="top"><div class="brand"><div class="logo">✓</div><div><h1 id="moduleName">模块自测</h1><div class="muted">挂载前缀 <code id="prefix">…</code></div></div><span id="state" class="badge">加载中</span></div><nav class="actions"><button id="start" class="primary">启动</button><button id="stop">关闭</button><button id="idempotency">幂等自检</button><button id="refresh">刷新</button></nav><div class="links"><a id="pageLink" target="_blank">打开整页</a><a id="cardLink" target="_blank">打开 card</a><a id="openapiLink" target="_blank">OpenAPI</a></div></header>
<div id="error" class="error" hidden></div><main class="layout"><section class="panel endpoints"><div class="panel-head"><h2>接口</h2><span id="endpointCount" class="muted"></span></div><div id="endpointList" class="endpoint-list"></div><div class="contract"><h2>契约自检</h2><div id="contractList"></div><div id="specError" class="warn-text"></div></div></section>
<section class="panel request-panel"><div class="panel-head"><h2>请求</h2><span class="muted">选择接口后编辑参数并发送</span></div><div class="form-row"><label>方法<select id="method"></select></label><label class="path-field">路径<input id="path" placeholder="/api/{id}"></label></div><div id="params" class="params"></div><label>请求体 <span id="bodyMedia" class="muted"></span><textarea id="body" rows="7" spellcheck="false" placeholder="JSON 或文本"></textarea></label><label>自定义请求头 <span class="muted">每行 key: value</span><textarea id="headers" rows="3" spellcheck="false" placeholder="X-Debug: 1"></textarea></label><div class="send-row"><button id="send" class="primary">发送请求</button><span id="callHint" class="muted"></span></div><div id="response" class="response" hidden></div></section>
<section class="panel pages"><div class="panel-head"><h2>页面 <small>按规则自动获取</small></h2><span id="pageCount" class="muted"></span></div><div id="pageList" class="page-list"></div><div id="preview" class="preview-empty">模块没有可预览的 HTML 页面</div><div id="source" class="source" hidden><div class="source-head"><b>页面源码</b><button id="closeSource">关闭</button></div><pre id="sourceText"></pre></div></section></main><div id="toast" class="toast" hidden></div><script src="/__test/ui/app.js"></script></body></html>

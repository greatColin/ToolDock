<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>温度折线图</title>
<style>
  body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;height:100vh;box-sizing:border-box;padding:12px;overflow:auto;background:transparent;color:#333}
  canvas{width:100%;height:calc(100% - 22px);display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cur">…</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), cur = document.getElementById('cur');
function draw(points){
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== w * dpr || cv.height !== h * dpr){ cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (points.length < 2){ ctx.fillText('采集中…', 8, 20); return }
  let min = Math.min(...points), max = Math.max(...points);
  if (max - min < 1){ min -= 0.5; max += 0.5 }
  const px = i => 6 + i * (w - 12) / (points.length - 1);
  const py = v => 6 + (1 - (v - min) / (max - min)) * (h - 22);
  ctx.beginPath();
  points.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
  ctx.strokeStyle = '#d88c6a';
  ctx.lineWidth = 2;
  ctx.stroke();
}
async function tick(){
  const {points = []} = await (await fetch('current')).json();
  const last = points[points.length - 1];
  if (last != null) cur.textContent = '摄氏 ' + last + '\u00b0C（近 ' + points.length + ' 点）';
  draw(points);
}
tick();
setInterval(tick, 1000);
/* 卡片右键转发宿主：以宿主视口坐标重新派发到 iframe 元素上 */
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  const f = window.frameElement;
  if (!f) return;
  const r = f.getBoundingClientRect();
  f.dispatchEvent(new MouseEvent('contextmenu', {bubbles:true, cancelable:true, clientX:r.left+e.clientX, clientY:r.top+e.clientY, button:2}));
});
</script>
</body>
</html>
